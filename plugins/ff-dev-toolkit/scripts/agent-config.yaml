# Multi-CLI Agent Orchestration Configuration
# See: docs-template/05-operations/deployment/multi-cli-review-orchestration.md

version: "2.0"
toolkit_version: "0.103.0"

# ── Global Defaults ──
# mode はタスク単位でも指定できる（tasks.<task>.mode）。ここはその既定。
mode: distributed  # distributed | cross-model | pair
parallel: true

# ── Excluded CLIs（この環境ではプランに載せない CLI）──
# 空白またはカンマ区切りの **1 文字列**（YAML リストは不可 — 読み飛ばして警告する）。
# 挙げた CLI は「未インストール」と同じ扱いになり、担当観点は既存の fallback 経路へ
# 回る。用途は「その機械では構造的に起動できない CLI」を毎回書かずに外すこと
# （例: Docker Desktop が /var/run/docker.sock を symlink にしていて grok-cli の
# read-only sandbox が起動を拒否する環境）。CLI 引数 --exclude-cli との**和集合**で、
# プラン表示にはどちらの由来かが出る。1 回だけ戻したいときは --cli <name> を明示する
# （その実行に限り設定の除外より優先される）。
# ⚠ 除外はカバレッジを減らす。cross-model が 1 本へ縮退した回はプランが警告する。
# 知らない CLI 名（retire 済みなど）がここに残っていても実行は止めず、その名前だけを
# 警告つきで読み飛ばす（設定は複数の機械・リポジトリで共有され、止めると「レビューが
# 1 本も走らない」を設定を書いた人でない誰かが踏む）。--exclude-cli の未知名は従来
# どおり非 0 — その 1 回のために打った指定なので、typo はその場で直せる。
#exclude_clis: "grok-cli"

# ── Task-specific Settings ──
# timeout は「1 CLI あたりの壁時計上限（秒）」。既定値は scripts/multi-agent.sh の
# DEFAULT_TIMEOUT_* が正本。本ファイル・`--help`・アダプタ単独実行時の既定
# （adapters/adapter-common.sh の REVIEW_TIMEOUT）・利用者向け文書の一致を
# tests/multi-agent-timeout/verify.sh が検査する（片方だけ直すと red になる）。
# CLI 別の上限は無い。唯一持っていた cursor-cli は issue #240 で削除され、上限の
# 仕組みごと撤去した（全 CLI が指定値をそのまま受け取る）。
# review が 900 なのは 300 では足りなかったため: 中規模差分（3 files, +881/-14）の
# Codex レビューが 300 秒時点でまだ作業中で、打ち切られて成果ゼロになった（Issue #152）。
tasks:
  review:
    # 主（メインで使う CLI）に review 観点すべて / 副に総合レビュー 1 本。
    # 従来の分散は --mode distributed で引き続き使える。
    mode: pair
    cost_strategy: balanced  # balanced | minimize_cost | maximize_quality
    output_dir: .review-results
    timeout: 900
  explore:
    cost_strategy: minimize_cost
    output_dir: .explore-results
    timeout: 600
  implement:
    cost_strategy: maximize_quality
    output_dir: .implement-results
    timeout: 900

# ── Review Reviewers（主 + 副） ──
# ⚠️ **このブロックは実行時に読まれる**（本ファイルで読まれるキーの一覧は
# docs-template/05-operations/deployment/multi-cli-agent-orchestration.md の
# 「実際に読まれるキー」節が正本）。
# 解決順は env（MULTI_AGENT_REVIEW_MAIN / _SUB）> 本ファイル > ユーザーグローバル
# （${XDG_CONFIG_HOME:-~/.config}/ff-dev-toolkit/reviewers）。
#
# 書けるのは **CLI 名だけ**。どのモデルを使うかは各 CLI 自身の設定へ委譲する
# （多重指定を作らないための不変条件）。CLI 名以外の値は実行前に非 0 で拒否される。
#review:
#  main: claude-code
#  sub: codex-cli
#  # CRITICAL_BLOCK を立てない「非ブロック観点」名簿の上書き（1 文字列、空白または
#  # カンマ区切り。YAML リストは不可）。既定は multi-agent.sh の
#  # DEFAULT_CRITICAL_NONBLOCK_PERSPECTIVES。env
#  # MULTI_AGENT_CRITICAL_NONBLOCK_PERSPECTIVES が設定されていればそちらが優先
#  critical_nonblock_perspectives: "comment-analysis test-analysis type-design-analysis code-simplification"

# ── Agent Definitions（CLI レジストリ）── ※ 本ファイルには置かない
# CLI 名・実行コマンド・コスト帯・観点割当（review / explore / implement）の正本は
# scripts/multi-agent.sh の get_cli_command / get_cli_cost_tier /
# get_cli_perspectives_review / get_cli_perspectives_explore /
# get_cli_perspectives_implement（bash 3.2 互換のため case 文）である。
# 以前はここに `agents:` の対応表を持っていたが、実行時に読まれない複製で、片側だけ
# 直されると黙って嘘になるため参照へ畳んだ。**この YAML に `agents:` を書いても
# 挙動は変わらない**（読まれるキーは上記の正本節が列挙する）。
# 現在の割当を確認するときは実装を読むか、プランを出力させる:
#   bash scripts/multi-agent.sh --task review --dry-run
#   bash scripts/multi-agent.sh --task review --list-perspectives
#
# モデル指定はここでは行わない。ラッパーは既定のモデル slug を持たず、各 CLI 自身の
# 設定（~/.codex/config.toml、Claude Code のモデル設定など）へ委譲する。明示指定が
# 要るときは環境変数を使う（MULTI_AGENT_MODEL_<CLI> / MULTI_AGENT_CODEX_PROFILE /
# MULTI_AGENT_CODEX_REASONING_EFFORT）。
# 理由は ACE-70-2（本リポジトリの ACE Playbook）を参照。

# ── Graceful Degradation（プラン構築時のみ／実行時失敗には適用しない） ──
# ※ 代替 CLI の対応表も本ファイルには置かない。正本は scripts/multi-agent.sh の
# get_cli_fallback（同じ理由で `fallback:` の対応表を参照へ畳んだ。ここに書いても
# 挙動は変わらない）。未インストール時にどこへ再分配されるかは
# `--dry-run` のプラン出力が実際の解決結果として示す。
#
# 代替が**適用**されるのは「CLI が未インストールでプランを組めないとき」だけ。
# 実行時失敗のあとにも参照はされるが、それは失敗サマリーで代替 CLI の名前とコスト帯を
# 示すためで、自動実行はしない。
# インストール済みの CLI が実行時にエラー／タイムアウトした場合、代替 CLI での
# 再実行は行わず、そのタスクを失敗として報告して非 0 終了する。
# 理由: 本ツールの価値は同じ差分を**別のモデル**に見せることなので、黙って差し替えると
# 「実際に何がレビューされたか」が変わるのにレポート上は観点が埋まって見える。
# また代替先はコスト帯が上がる場合がある（codex-cli → claude-code は standard →
# premium）。タイムアウト後の再試行は同じ制限時間をもう一度消費するだけになりやすい。
# 代替を使いたいときは失敗サマリーが出力するコマンドで `--cli` 明示して実行する。
