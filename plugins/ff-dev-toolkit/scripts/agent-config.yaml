# Multi-CLI Agent Orchestration Configuration
# See: docs-template/05-operations/deployment/multi-cli-review-orchestration.md

version: "2.0"

# ── Global Defaults ──
# mode はタスク単位でも指定できる（tasks.<task>.mode）。ここはその既定。
mode: distributed  # distributed | cross-model | pair
parallel: true

# ── Task-specific Settings ──
# timeout は「1 CLI あたりの壁時計上限（秒）」。既定値は scripts/multi-agent.sh の
# DEFAULT_TIMEOUT_* が正本。本ファイル・`--help`・アダプタ単独実行時の既定
# （adapters/adapter-common.sh の REVIEW_TIMEOUT）・利用者向け文書の一致を
# tests/multi-agent-timeout/verify.sh が検査する（片方だけ直すと red になる）。
# CLI 別の上限は無い。唯一持っていた cursor-cli は issue #240 で削除され、上限の
# 仕組みごと撤去した（全 CLI が指定値をそのまま受け取る）。
# review が 900 なのは 300 では足りなかったため: 中規模差分（3 files, +881/-14）の
# Codex レビューが 300 秒時点でまだ作業中で、打ち切られて成果ゼロになった（Issue #152）。
tasks:
  review:
    # 主（メインで使う CLI）に review 観点すべて / 副に総合レビュー 1 本。
    # 従来の分散は --mode distributed で引き続き使える。
    mode: pair
    cost_strategy: balanced  # balanced | minimize_cost | maximize_quality
    output_dir: .review-results
    timeout: 900
  explore:
    cost_strategy: minimize_cost
    output_dir: .explore-results
    timeout: 600
  implement:
    cost_strategy: maximize_quality
    output_dir: .implement-results
    timeout: 900

# ── Review Reviewers（主 + 副） ──
# ⚠️ 下の agents: / fallback: と違い、**このブロックは実行時に読まれる**。
# 解決順は env（MULTI_AGENT_REVIEW_MAIN / _SUB）> 本ファイル > ユーザーグローバル
# （${XDG_CONFIG_HOME:-~/.config}/ff-dev-toolkit/reviewers）。
#
# 書けるのは **CLI 名だけ**。どのモデルを使うかは各 CLI 自身の設定へ委譲する
# （issue #239 の不変条件）。CLI 名以外の値は実行前に非 0 で拒否される。
#review:
#  main: claude-code
#  sub: codex-cli

# ── Agent Definitions ──
# ⚠️ このブロックは**実行時には読まれない**。CLI レジストリの正本は
# scripts/multi-agent.sh の get_cli_command / get_cli_cost_tier /
# get_cli_perspectives_* / get_cli_fallback（bash 3.2 互換のため case 文）である。
# ここは人が読むための対応表として維持している。値を書き換えても挙動は変わらないので、
# 実際の割当を変えるときは multi-agent.sh を直すこと。
#
# 読まれないのは agents: と下の fallback: だけで、本ファイル全体ではない。
# version / mode / parallel、上の review:、tasks.<task>.{mode,cost_strategy,timeout,
# output_dir} は実行時に yq で読まれる。読まれるキーをここに列挙すると設定追加のたびに
# 腐るので書かない（この対応表が読まれないことだけが、下のミラー検査の前提）。
#
# この対応表は「検証されたミラー」である（issue #242）。command / cost_tier /
# perspectives（review/explore/implement）/ fallback の値が multi-agent.sh の case 文と
# 一致していることを tests/agent-config-mirror/verify.sh が検査する。片方だけ直すと
# red になるので、ここと multi-agent.sh は必ず両方揃えて更新すること。
#
# モデル指定はここでは行わない。ラッパーは既定のモデル slug を持たず、各 CLI 自身の
# 設定（~/.codex/config.toml、Claude Code のモデル設定など）へ委譲する。明示指定が
# 要るときは環境変数を使う（MULTI_AGENT_MODEL_<CLI> / MULTI_AGENT_CODEX_PROFILE）。
# 理由は docs-template/08-knowledge/playbook/tooling.md の ACE-70-2 を参照。
agents:
  claude-code:
    command: claude
    cost_tier: premium
    perspectives:
      review:
        - type-design-analysis
        - code-simplification  # cursor-cli 削除（issue #240）に伴い移設
      explore:
        - architecture-analysis
      implement:
        - feature-implementation

  codex-cli:
    command: codex
    cost_tier: standard
    perspectives:
      review:
        - code-review
        - test-analysis
      explore:
        - dependency-mapping
      implement:
        - refactoring

  copilot-cli:
    command: copilot
    cost_tier: metered  # 従量課金（premium requests）— review 既定ラインナップから除外
    perspectives:
      review:  # 既定プランには載らない。--cli copilot-cli 明示時のみ実行（オプトイン）
        - test-analysis
        - comment-analysis
      explore:
        - api-surface-analysis
      implement:
        - test-writing

  gemini-cli:
    command: gemini
    cost_tier: free-tier
    perspectives:
      review:
        - security-analysis
        - comment-analysis
      explore:
        - pattern-discovery  # cursor-cli 削除（issue #240）に伴い移設
      implement:
        - documentation

  grok-cli:
    command: grok
    cost_tier: flat-rate
    perspectives:
      review:
        - error-handler-hunt  # grok-cli 追加（issue #252）に伴い codex-cli から移設
      explore:
        - tech-debt-assessment  # 同上（gemini-cli から移設）
      implement:
        - migration  # 同上（codex-cli から移設）

# ── Graceful Degradation（プラン構築時のみ／実行時失敗には適用しない） ──
# ⚠️ agents: と同じく、このブロックも**実行時には読まれない**。正本は
# scripts/multi-agent.sh の get_cli_fallback。ここは人が読むための対応表で、
# 値が case 文と一致していることを tests/agent-config-mirror/verify.sh が検査する
# （issue #242。片方だけ直すと red）。
#
# この対応表が**適用**されるのは「CLI が未インストールでプランを組めないとき」だけ。
# 実行時失敗のあとにも参照はされるが、それは失敗サマリーで代替 CLI の名前とコスト帯を
# 示すためで、自動実行はしない。
# インストール済みの CLI が実行時にエラー／タイムアウトした場合、代替 CLI での
# 再実行は行わず、そのタスクを失敗として報告して非 0 終了する（Issue #152）。
# 理由: 本ツールの価値は同じ差分を**別のモデル**に見せることなので、黙って差し替えると
# 「実際に何がレビューされたか」が変わるのにレポート上は観点が埋まって見える。
# また代替先はコスト帯が上がる場合がある（codex-cli → claude-code は standard →
# premium）。タイムアウト後の再試行は同じ制限時間をもう一度消費するだけになりやすい。
# 代替を使いたいときは失敗サマリーが出力するコマンドで `--cli` 明示して実行する。
fallback:
  claude-code: codex-cli
  codex-cli: claude-code
  copilot-cli: codex-cli
  gemini-cli: codex-cli
  grok-cli: gemini-cli  # 定額制の代替は無料枠を先に見る（minimize_cost の意図を保つ）
