# Multi-CLI Agent Orchestration Configuration
# See: docs-template/05-operations/deployment/multi-cli-review-orchestration.md

version: "2.0"

# ── Global Defaults ──
mode: distributed  # distributed | cross-model
parallel: true

# ── Task-specific Settings ──
# timeout は「1 CLI あたりの壁時計上限（秒）」。既定値は scripts/multi-agent.sh の
# DEFAULT_TIMEOUT_* が正本。本ファイル・`--help`・アダプタ単独実行時の既定
# （adapters/adapter-common.sh の REVIEW_TIMEOUT）・利用者向け文書の一致を
# tests/multi-agent-timeout/verify.sh が検査する（片方だけ直すと red になる）。
# なお cursor-cli だけは非インタラクティブ時のハング対策で 120 秒に上限が掛かる
# （multi-agent.sh の get_cli_timeout_cap）。
# review が 900 なのは 300 では足りなかったため: 中規模差分（3 files, +881/-14）の
# Codex レビューが 300 秒時点でまだ作業中で、打ち切られて成果ゼロになった（Issue #152）。
tasks:
  review:
    cost_strategy: balanced  # balanced | minimize_cost | maximize_quality
    output_dir: .review-results
    timeout: 900
  explore:
    cost_strategy: minimize_cost
    output_dir: .explore-results
    timeout: 600
  implement:
    cost_strategy: maximize_quality
    output_dir: .implement-results
    timeout: 900

# ── Agent Definitions ──
# ⚠️ このブロックは**実行時には読まれない**。CLI レジストリの正本は
# scripts/multi-agent.sh の get_cli_command / get_cli_cost_tier /
# get_cli_perspectives_* / get_cli_fallback（bash 3.2 互換のため case 文）で、
# 本ファイルから yq が読むのは version / mode / parallel と、version が "2.0" の
# ときだけ tasks.<task>.{cost_strategy,timeout,output_dir} だけ。ここは人が読む
# ための対応表として維持している。値を書き換えても挙動は変わらないので、
# 実際の割当を変えるときは multi-agent.sh を直すこと。
#
# モデル指定はここでは行わない。ラッパーは既定のモデル slug を持たず、各 CLI 自身の
# 設定（~/.codex/config.toml、Claude Code のモデル設定など）へ委譲する。明示指定が
# 要るときは環境変数を使う（MULTI_AGENT_MODEL_<CLI> / MULTI_AGENT_CODEX_PROFILE）。
# 理由は docs-template/08-knowledge/playbook/tooling.md の ACE-70-2 を参照。
agents:
  claude-code:
    command: claude
    cost_tier: premium
    perspectives:
      review:
        - type-design-analysis
      explore:
        - architecture-analysis
      implement:
        - feature-implementation

  codex-cli:
    command: codex
    cost_tier: standard
    perspectives:
      review:
        - code-review
        - error-handler-hunt
        - test-analysis
      explore:
        - dependency-mapping
      implement:
        - refactoring

  copilot-cli:
    command: copilot
    cost_tier: metered  # 従量課金（premium requests）— review 既定ラインナップから除外
    perspectives:
      review:  # 既定プランには載らない。--cli copilot-cli 明示時のみ実行（オプトイン）
        - test-analysis
        - comment-analysis
      explore:
        - api-surface-analysis
      implement:
        - test-writing

  gemini-cli:
    command: gemini
    cost_tier: free-tier
    perspectives:
      review:
        - security-analysis
        - comment-analysis
      explore:
        - tech-debt-assessment
      implement:
        - documentation

  cursor-cli:
    command: cursor-agent
    cost_tier: flat-rate
    perspectives:
      review:
        - code-simplification
      explore:
        - pattern-discovery
      implement:
        - migration

# ── Graceful Degradation（プラン構築時のみ／実行時失敗には適用しない） ──
# ⚠️ agents: と同じく、このブロックも**実行時には読まれない**。正本は
# scripts/multi-agent.sh の get_cli_fallback。ここは人が読むための対応表。
#
# この対応表が**適用**されるのは「CLI が未インストールでプランを組めないとき」だけ。
# 実行時失敗のあとにも参照はされるが、それは失敗サマリーで代替 CLI の名前とコスト帯を
# 示すためで、自動実行はしない。
# インストール済みの CLI が実行時にエラー／タイムアウトした場合、代替 CLI での
# 再実行は行わず、そのタスクを失敗として報告して非 0 終了する（Issue #152）。
# 理由: 本ツールの価値は同じ差分を**別のモデル**に見せることなので、黙って差し替えると
# 「実際に何がレビューされたか」が変わるのにレポート上は観点が埋まって見える。
# また代替先はコスト帯が上がる場合がある（codex-cli → claude-code は standard →
# premium）。タイムアウト後の再試行は同じ制限時間をもう一度消費するだけになりやすい。
# 代替を使いたいときは失敗サマリーが出力するコマンドで `--cli` 明示して実行する。
fallback:
  claude-code: codex-cli
  codex-cli: claude-code
  copilot-cli: codex-cli
  gemini-cli: codex-cli
  cursor-cli: codex-cli
